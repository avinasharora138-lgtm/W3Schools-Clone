<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg,#4f46e5,#06b6d4);
    }
    .login-container{
        background-color: #fff;
        width: 360px;
        padding: 40px;
        border-radius: 15px;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
    }
    .login-container h2{
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }
    .input-group{
        margin-bottom: 20px;
    }
    .input-group label{
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-size: 14px;
    }
    .input-group input{
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: .3s;
    }
    .input-group input:focus{
        border-color: #4f46e5;
    }
    .options{
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        margin-bottom: 20px;
        
    }
    .options a{
        text-decoration: none;
        color: #4f46e5;
    }
    /* .options a:hover{
        color: aqua;
    } */
    button{
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: .3s;
    }
    button:hover{
        background: #4338ca;
    }
    .signup{
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }
    .signup a{
        color: #4f46e5;
        text-decoration: none;
        font-weight: bold;
    }
    /* .signup a:hover{
        background-color: violet;
        
    }
    .login-container>*:hover{
color: #06b6d4;
    } */
    /* .input-group:hover{
        scale: 1.3;
    }
    .input-group input:focus{
        background-color: yellowgreen;
    }
    .input-group input:active{
        background-color: #4f46e5;
    } */
     .buttonclick{
        height: 100px;
        width: 150px;
        border: 1px solid;
        padding: 20px;
        box-sizing: border-box;
        transition: all 2s;
        transform: translate(100px, 100px) rotate(20deg) skew(20deg) scale(1.4);
     }
     .buttonclick:hover{
        background-color: red;
        border-radius: 50%;
     }
</style>
<body>
    <div class="login-container">
        <h2>Welcome Back</h2>
        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your Email here" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password here" required>
            </div>
            <div class="options">
                <label>
                    <input type="checkbox">Remember me
                </label>
                <a href="#">Forget Password</a>
            </div>
            <button type="submit">Login</button>
            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
            <div class="buttonclick">
                <button class="buttonclickclass">click here</button>
            </div>
        </form>
    </div>
</body>
</html>

    *{

        padding: 0;

    .list{
        display: flex;
        background-color: orange;
        color: white;
    }
    .list ul{
        list-style: none;
        display: flex;
        margin: 40px;
        gap: 40px;

    }
    .list ul li a{
        text-decoration: none;
        color: white;
        
    }
    .label{
        margin: 35px;
    }
    .label button{
        background-color: white;
        border: 0;
        color: orange;
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 5px;
        padding-bottom: 5px;
        border-radius: 20px;
        width: 200px;
    }
    .list ul li a:hover{
        background-color: white;
        color: orange;
        border-radius: 10px;
        padding-left: 20px;
        padding-right: 20px;

    }
    .list ul li a:active{

        color: orangered;
    }

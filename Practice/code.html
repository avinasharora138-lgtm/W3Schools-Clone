<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <h2>Code tag</h2>
    <p>Different formatting by using code tag</p>
    <code>
        "HTML Body"
    </code>
    <h2>
        Code tag by using br tag
    </h2>
    <code>
        "HTML<br>
        Body"
    </code>
    <h2>Code Tag by using hr tag</h2>
    <code>
        "HTML<br>
        Body"<hr>
    </code>
    <h2>Code tag by using &lt and &gt</h2>
    <code>
        &lt;HTML Body&gt;
    </code>
    
</body>
</html>

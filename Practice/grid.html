<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
</head>
<style>
    .container{
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: repeat(4,100px);
        /*grid-auto-rows: 90px;*/
    }
    .container div{
        border: 2px solid;
    }
    #initial{
        grid-row: 1/4;
    }
    #next{
        grid-row: 1/3;
        grid-column: 2/3;
    }
</style>
<body>
    <div class="container">
        <div id="initial">1</div>
    <div id="next">2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>10</div>
    <div>11</div>
    <div>12</div>
    </div>
</body>
</html>

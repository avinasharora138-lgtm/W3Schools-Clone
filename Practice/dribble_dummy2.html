<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .logo{
        font-size: 30px;
        font-weight: bold;
        font-family: cursive;
       }
        .navbar{
            display: flex;
            margin: 20px;
            gap: 40px;
            align-items: center;
            /* justify-content: space-between; */
            cursor: pointer;
        }
        .navbar a{
            text-decoration: none;
            color: black;
            font-size: large;
            
        }
        .signup{
            background-color: white;
            border: 0;
            font-weight: bold;
            font-size: large;
            cursor: pointer;
        }
        .login{
            background-color: black;
            color: white;
            border-radius: 20px;
            border: 0;
            font-weight: bold;
            font-size: large;
            padding: 10px;
            cursor: pointer;
        }
        .main{
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .hire{
            background-color: white;
            border-radius: 20px;
            border: 2px solid black;
            box-shadow: 5px 10px 15px 2px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            cursor: pointer;
        }
        .get{
            background-color: white;
            border-radius: 20px;
            border: 2px solid black;
            box-shadow: 5px 10px 15px 2px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
     <header class="navbar">
        <span class="logo">Dribbble</span>
        <nav class="main">
            <a href="">Explore</a>
            <a href="">Hire Talent</a>
            <a href="">Get Hired</a>
            <a href="">Community</a>
            
        </nav>
        <button class="signup">Sign Up</button>
            <button class="login">Login</button>
     </header>
     <div>
            <button class="hire">HIRE TALENT</button>
            <button class="get">GET HIRED</button>
            <nav>
                <h1>Work with the world's best in mobile design</h1>
                <p>Generate your brief and receive proposals-for free</p>
                <p>Browse real design and development work</p>
            </nav>
        </div>
</body>
</html>
